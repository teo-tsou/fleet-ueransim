global:
  # EDGE-UPF SPLIT TOPOLOGY — N2 and N3 are NOT symmetric here:
  #   * N2 (gNB→AMF) CROSSES UCs → the AMF lives on the core UC. A Multus L2
  #     can't cross UCs over OVN-IC (same reason MetalLB L2 didn't), so N2
  #     rides the pod network via the IntEdge `amf` binding. n2network OFF.
  #   * N3 (gNB→UPF) is LOCAL → the UPF (fleet-free5gc-upf) sits in THIS edge
  #     UC right next to the gNB. The SMF hands the gNB the edge UPF's N3 ipvlan
  #     endpoint (10.100.50.233), so the gNB's GTP-U MUST be on that same local
  #     ipvlan L2. n3network ON. This traffic never leaves the edge UC.
  n2network:
    enabled: false
    name: n2network
    type: ipvlan
    masterIf: enp1s0
    subnetIP: 10.100.50.248
    cidr: 29
    gatewayIP: 10.100.50.254
    excludeIP: 10.100.50.254
  n3network:
    enabled: true
    name: n3network
    type: ipvlan
    masterIf: enp1s0
    subnetIP: 10.100.50.232
    cidr: 29
    gatewayIP: 10.100.50.238
    excludeIP: 10.100.50.238

projectName: ueransim

gnb:
  enabled: true
  n2if:
    ipAddress: 0.0.0.0     # unused now — ngapIp comes from the ngap.enabled branch
  n3if:
    # gNB's GTP-U (N3) IP on the LOCAL edge ipvlan, same /29 as the edge UPF's
    # N3 endpoint (10.100.50.233). .233 = UPF, .238 = excluded gateway → use
    # .234. This becomes both the Multus ipvlan IP and the gNB's gtpIp, so
    # GTP-U reaches the co-located edge UPF over local L2.
    ipAddress: 10.100.50.234
  amf:
    n2if:
      # The IntEdge binding creates this Service in the consumer UC and maps
      # it to free5gC's AMF (core-5g VM-IP : NodePort) over the encrypted
      # fabric. The gNB dials a stable local name — zero IPs.
      ipAddress: amf.upstream.svc.cluster.local
      port: 38412
    service:
      ngap:
        enabled: true      # → gNB ngapIp: 0.0.0.0 (reach AMF over pod-net)
  configuration: |-
    mcc: '208'
    mnc: '93'
    nci: '0x000000010'
    idLength: 32
    tac: 1
    slices:
      - sst: 0x1
        sd: 0x010203
    ignoreStreamIds: true

ue:
  enabled: true
  configuration: |-
    supi: "imsi-208930000000003"
    mcc: '208'
    mnc: '93'
    key: "8baf473f2f8fd09487cccbd7097c6862"
    op: "8e27b6af0e692e750f32667a3b14605d"
    opType: "OPC"
    amf: '8000'
    imei: '356938035643803'
    imeiSv: '4370816125816151'
    uacAic:
      mps: false
      mcs: false
    uacAcc:
      normalClass: 0
      class11: false
      class12: false
      class13: false
      class14: false
      class15: false
    sessions:
      - type: "IPv4"
        apn: "internet"
        slice:
          sst: 0x01
          sd: 0x010203
    configured-nssai:
      - sst: 0x01
        sd: 0x010203
    default-nssai:
      - sst: 1
        sd: 0x010203
    integrity:
      IA1: true
      IA2: true
      IA3: true
    ciphering:
      EA1: true
      EA2: true
      EA3: true
    integrityMaxRate:
      uplink: 'full'
      downlink: 'full'