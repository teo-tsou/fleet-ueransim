global:
  # Multus L2 (ipvlan) DISABLED. A secondary L2 can't cross UCs over OVN-IC
  # (same reason MetalLB L2 didn't). Cross-UC N2 rides the pod network via
  # the IntEdge binding instead. With both off, the gNB pod has only eth0
  # → binding N2/N3 to 0.0.0.0 is single-homed (no SCTP multi-homing of
  # dead 10.100.50.x paths).
  n2network:
    enabled: false
    name: n2network
    type: ipvlan
    masterIf: enp1s0
    subnetIP: 10.100.50.248
    cidr: 29
    gatewayIP: 10.100.50.254
    excludeIP: 10.100.50.254
  n3network:
    enabled: false
    name: n3network
    type: ipvlan
    masterIf: enp1s0
    subnetIP: 10.100.50.232
    cidr: 29
    gatewayIP: 10.100.50.238
    excludeIP: 10.100.50.238

projectName: ueransim

gnb:
  enabled: true
  n2if:
    ipAddress: 0.0.0.0     # unused now — ngapIp comes from the ngap.enabled branch
  n3if:
    ipAddress: 0.0.0.0     # → gtpIp: 0.0.0.0 (bind GTP-U on eth0; no Multus n3)
  amf:
    n2if:
      # The IntEdge binding creates this Service in the consumer UC and maps
      # it to free5gC's AMF (core-5g VM-IP : NodePort) over the encrypted
      # fabric. The gNB dials a stable local name — zero IPs.
      ipAddress: amf.upstream.svc.cluster.local
      port: 38412
    service:
      ngap:
        enabled: true      # → gNB ngapIp: 0.0.0.0 (reach AMF over pod-net)
  configuration: |-
    mcc: '208'
    mnc: '93'
    nci: '0x000000010'
    idLength: 32
    tac: 1
    slices:
      - sst: 0x1
        sd: 0x010203
    ignoreStreamIds: true

ue:
  enabled: true
  configuration: |-
    supi: "imsi-208930000000003"
    mcc: '208'
    mnc: '93'
    key: "8baf473f2f8fd09487cccbd7097c6862"
    op: "8e27b6af0e692e750f32667a3b14605d"
    opType: "OPC"
    amf: '8000'
    imei: '356938035643803'
    imeiSv: '4370816125816151'
    uacAic:
      mps: false
      mcs: false
    uacAcc:
      normalClass: 0
      class11: false
      class12: false
      class13: false
      class14: false
      class15: false
    sessions:
      - type: "IPv4"
        apn: "internet"
        slice:
          sst: 0x01
          sd: 0x010203
    configured-nssai:
      - sst: 0x01
        sd: 0x010203
    default-nssai:
      - sst: 1
        sd: 0x010203
    integrity:
      IA1: true
      IA2: true
      IA3: true
    ciphering:
      EA1: true
      EA2: true
      EA3: true
    integrityMaxRate:
      uplink: 'full'
      downlink: 'full'